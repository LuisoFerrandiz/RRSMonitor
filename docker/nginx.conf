# Bloque `server` para el contenedor nginx que sirve el dashboard (data/ montado en
# /usr/share/nginx/html) y hace de proxy de /api/ hacia el servicio Node `rrs-scheduler`.
# HTTP/2 y TLS se terminan en el reverse proxy de DSM que hay por delante, no aquí.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # --- Entrega de estáticos ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # --- Compresión ---
    # El mayor ahorro de la Fase 1: HTML y los .jsonl (JSON casi idéntico línea a
    # línea) comprimen ~85-90 %. La ruta crítica pasa de ~1 MB a ~100-130 KB.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/x-ndjson
        application/manifest+json
        image/svg+xml;

    location /api/ {
        proxy_pass http://rrs-scheduler:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Datos de runtime: revalidar siempre. El dashboard hace poll cada 30 s; con el
    # ETag de nginx las respuestas sin cambios son un 304 vacío (el frontend ya no
    # manda ?t=Date.now(), que impedía toda revalidación).
    location ~* \.jsonl$ {
        default_type application/x-ndjson;
        add_header Cache-Control "no-cache";
        access_log off;
    }
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Código y recursos estáticos: cache larga. Cambian solo con un deploy del
    # contenedor; si hiciera falta invalidación inmediata habría que versionar el
    # nombre del archivo.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML (incluido viewer.html): revalidar para coger la nueva versión tras un
    # deploy sin re-descargar los ~270 KB si no cambió (304 con ETag).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
